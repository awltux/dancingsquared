<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 148" width="460" height="148" role="img" aria-label="Eight beats counted two ways. In the top row the music is 2/4, so a bar is two beats and the phrase is four bars. In the bottom row it is 4/4, so a bar is four beats and the same eight beats are two bars. Beats 1 and 5 are the strong ones.">
<title>How long a phrase is</title>
