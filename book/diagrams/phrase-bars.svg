<text x="418.5" y="24" text-anchor="middle" font-family="system-ui, sans-serif" font-size="13" font-weight="600" letter-spacing="0.6" fill="#9fadb5">8</text>
<text x="16" y="57" text-anchor="start" font-family="system-ui, sans-serif" font-size="22" font-weight="700" letter-spacing="0.6" fill="#22303a">2/4</text>
<text x="16" y="75" text-anchor="start" font-family="system-ui, sans-serif" font-size="11.5" font-weight="600" letter-spacing="0.6" fill="#9fadb5">2 beats a bar</text>
