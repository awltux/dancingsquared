<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dancing Squared</title>
    <link rel="stylesheet" href="/src/style.css" />
    <!-- THE APP IS OFFLINE BY DESIGN (AGENTS.md §6): no font CDN, no analytics, no stylesheet from a
         network. Every asset here is bundled, so the game works from a file:// build and adds no
         external dependency to a page whose audience is an older one on unpredictable connections. -->
  </head>
  <body>
    <div id="app">
      <canvas id="stage"></canvas>

      <!-- THE BOARD CAPTIONS SIT OVER THE CANVAS, centred on each board's half of the frame. Without them
           the two floor grids read as ONE board with dancers scattered across it — the two-board framing is
           invisible until you say which side is which. They are `pointer-events: none` so a drag on the
           board still reaches the camera controls underneath. Their TEXT is written by the app, because the
           engine can name the board a player is standing on and naming it is a teaching aid (DESIGN.md 15,
           Q10) — never the correctness test, which is the board itself. -->
      <p class="board-label" id="labelHere">You are here</p>
      <p class="board-label" id="labelGoal">Get here</p>

      <main id="panel">
        <header id="head">
          <h1>Dancing Squared</h1>
          <p id="regime"></p>
          <!-- THE ACCOUNT ROW IS THE SIGN-IN SURFACE (DESIGN.md §11.2), and it starts HIDDEN because both the
               offline game and a `dev` server have no account to offer: `ui/account-screen.ts` reveals it only
               when there is something true to say, and the form inside it only when `/health` advertises sign-in
               routes — a form at a server that would answer 404 is the failure reading that list avoids. -->
          <section id="account" hidden>
            <p id="accountStatus"></p>
            <form id="accountForm" hidden>
              <input id="accountEmail" type="email" name="email" autocomplete="username" placeholder="you@example.com" aria-label="Email address" />
              <input id="accountPassword" type="password" name="password" autocomplete="current-password" placeholder="Password" aria-label="Password" />
              <button id="accountSignIn" type="submit">Sign in</button>
              <button id="accountSignUp" type="button">Create an account</button>
              <input id="accountCode" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="Code" aria-label="Confirmation code" hidden />
              <button id="accountConfirm" type="button" hidden>Confirm</button>
            </form>
            <button id="accountSignOut" type="button" hidden>Sign out</button>
          </section>
          <!-- THE TWO MODES ARE A CHOICE, NOT A SETTING: the Drill is the regime in order and the Daily is
               one issued challenge, and each has its own panel below. Switching keeps a Daily already in
               progress rather than restarting its clock — see `setMode` in `main.ts`. -->
          <nav id="modes">
            <button id="modeDrill" type="button" aria-pressed="true">The Drill</button>
            <button id="modeDaily" type="button" aria-pressed="false">Today's Daily</button>
          </nav>
        </header>

        <section id="drill" aria-live="polite">
          <p id="prompt"></p>
          <div id="answers"></div>
          <div id="verdict" role="status"></div>
        </section>

        <section id="daily" aria-live="polite" hidden>
          <p id="dailyPrompt"></p>
          <p id="dailyReadout"></p>
          <!-- THE OFFERING LIST IS WHAT IS LEGAL NOW (DESIGN.md 9, decision 9) — not what is still solvable.
               Dead ends are the player's to discover, and the score is what makes discovering them cost. -->
          <div id="offer"></div>
          <p id="line"></p>
          <div id="dailyVerdict" role="status"></div>
          <div id="dailyResult" hidden></div>
        </section>

        <!-- THE BOARD IS A PANEL AND NOT A THIRD MODE: a mode is something a player PLAYS, and a board is a read
             (DESIGN.md §6, §11). It is loaded on demand — a board is a request, and a player who came to play
             should not pay for one they did not ask for. It says which board it is showing, because "the
             leaderboard" is three facts (§6: mode, level, period) and comparing across levels is comparing
             nothing. -->
        <section id="board" aria-live="polite" hidden>
          <p id="boardHeading"></p>
          <p id="boardStatus"></p>
          <ol id="boardList"></ol>
        </section>

        <footer id="foot">
          <!-- THE HINT ROW IS SHARED: the balance is earned on the drill line and spent on the Daily
               (DESIGN.md 10), so a player in either mode needs to see what they hold and how close the next
               one is. The progress is "silent" and the GRANT is announced once, which is the design's own
               pair of rules. -->
          <p id="balance"></p>
          <!-- WHAT IS KEPT ON THIS DEVICE. The anonymous ledger is the funnel (DESIGN.md 11: a player with a
               score to lose is a player who signs up), so the count and the best are visible before there is
               an account to claim them with — and a browser that blocks storage says so here rather than
               pretending. -->
          <p id="ledger"></p>
          <button id="hint" type="button" hidden>Hint (+1 min)</button>
          <button id="review" type="button" hidden>Show me the answer — this drill will not count</button>
          <!-- THE SKIP (DESIGN.md §15 Q5) is the mark-and-continue: the regime is an ORDER, so one puzzle a player
               cannot solve blocks every drill behind it. It earns nothing and grants no hint, and the label says so
               before the press rather than in a verdict afterwards. -->
          <button id="skip" type="button" hidden>Skip this drill — no score, no hint</button>
          <button id="undo" type="button" hidden>Undo</button>
          <button id="redo" type="button" hidden>Redo</button>
          <button id="giveUp" type="button" hidden>Give up</button>
          <button id="replayMine" type="button" hidden>Replay my line</button>
          <button id="replayShortest" type="button" hidden>Replay the shortest</button>
          <button id="view" type="button">Switch to 2D</button>
          <!-- THE PRACTICE OFFER (DESIGN.md §15 Q20) is HIDDEN until the server refuses a drill: the fixture's order
               is not the season's, so it is offered by name rather than substituted quietly, and the label says what
               taking it means. -->
          <button id="practice" type="button" hidden>Practice offline — this one will not count</button>
          <button id="boardToggle" type="button">Show the board</button>
          <!-- THE ONE CONTROL THAT DELETES SOMETHING (DESIGN.md §15 Q18). It is a FOOTER control rather than a
               browser dialog because the armed state is a rule the shell owns — two presses, with the second one
               saying what will go — where a native `confirm()` is an API no probe can see. The ledger's own line
               ("Saved on this device: nothing yet") is what reports the result. -->
          <button id="startOver" type="button">Start over on this device</button>
          <button id="next" type="button" hidden>Next drill</button>
        </footer>
      </main>

      <div id="loading">Loading the corpus…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
