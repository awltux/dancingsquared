<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dancing Squared</title>
    <link rel="stylesheet" href="/src/style.css" />
    <!-- THE APP IS OFFLINE BY DESIGN (AGENTS.md §6): no font CDN, no analytics, no stylesheet from a
         network. Every asset here is bundled, so the game works from a file:// build and adds no
         external dependency to a page whose audience is an older one on unpredictable connections. -->
  </head>
  <body>
    <div id="app">
      <canvas id="stage"></canvas>

      <!-- THE BOARD CAPTIONS SIT OVER THE CANVAS, centred on each board's half of the frame. Without them
           the two boards read as ONE set with dancers scattered across it. They are `pointer-events: none` so a
           drag on the board still reaches the camera controls underneath. Their TEXT is written by the app: the
           pair is two WAYPOINTS of one puzzle, so each caption says which waypoint and where it sits in the
           sequence, and the engine's name is an aside (DESIGN.md 15, Q10 — display only, never the correctness
           test, which is the board itself). -->
      <p class="board-label" id="labelHere">Setup</p>
      <p class="board-label" id="labelGoal">Next waypoint</p>

      <!-- THE WAYPOINT PAGING. A puzzle is a sequence of waypoints and the boards show two adjacent ones; these
           walk that window along the route so the player can look ahead or back. Hidden when the puzzle has only
           the start and the end, because then there is nothing between to page through. Real buttons, because a
           touch has to be able to hit them. -->
      <button id="waypointPrev" class="wp-nav wp-prev" type="button" aria-label="Previous waypoints" hidden>‹</button>
      <button id="waypointNext" class="wp-nav wp-next" type="button" aria-label="Next waypoints" hidden>›</button>
      <!-- WHAT THE BORDERS MEAN. The states are colour, and a state told by colour alone is unreadable for a
           colour-blind player, so the words are here and the swatches take their colours from the same constants
           the stage draws with (main.ts copies them into these custom properties). -->
      <p id="waypointLegend" hidden><span class="wp-key wp-key-solved">✓</span> solved · <span class="wp-key wp-key-next">●</span> next · <span class="wp-key wp-key-locked">✕</span> locked</p>

      <main id="panel">
        <header id="head">
          <h1>Dancing Squared</h1>
          <p id="regime"></p>
          <!-- THE ACCOUNT ROW IS THE SIGN-IN SURFACE (DESIGN.md §11.2), and it starts HIDDEN because both the
               offline game and a `dev` server have no account to offer: `ui/account-screen.ts` reveals it only
               when there is something true to say, and the form inside it only when `/health` advertises sign-in
               routes — a form at a server that would answer 404 is the failure reading that list avoids. -->
          <section id="account" hidden>
            <p id="accountStatus"></p>
            <form id="accountForm" hidden>
              <input id="accountEmail" type="email" name="email" autocomplete="username" placeholder="you@example.com" aria-label="Email address" />
              <input id="accountPassword" type="password" name="password" autocomplete="current-password" placeholder="Password" aria-label="Password" />
              <button id="accountSignIn" type="submit">Sign in</button>
              <button id="accountSignUp" type="button">Create an account</button>
              <input id="accountCode" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="Code" aria-label="Confirmation code" hidden />
              <button id="accountConfirm" type="button" hidden>Confirm</button>
            </form>
            <button id="accountSignOut" type="button" hidden>Sign out</button>
          </section>
          <!-- THE TWO MODES ARE A CHOICE, NOT A SETTING: the Drill is the regime in order and the Daily is
               one issued challenge, and each has its own panel below. Switching keeps a Daily already in
               progress rather than restarting its clock — see `setMode` in `main.ts`. -->
          <nav id="modes">
            <button id="modeDrill" type="button" aria-pressed="true">The Drill</button>
            <button id="modeDaily" type="button" aria-pressed="false">Today's Daily</button>
          </nav>
        </header>

        <!-- THE LEVEL IS THE DRILL TAB'S HOME (DESIGN.md §15 Q17(v)): a 10x10 block, one cell per drill, shown
             BEFORE the question because it says where the player is. The cells come from `puzzle/block.ts`, whose
             rule is gated by `test/block-probe.mjs`; this markup only gives them somewhere to go. The block is
             rebuilt on every paint, so it holds no authored cells. -->
        <section id="level" aria-live="polite">
          <p id="levelHeading"></p>
          <div id="levelBlock"></div>
          <!-- SHOWN ONLY WHEN THE BLOCK IS FULL: the level is over, and the shell re-issues, which is what lets the
               server promote. A player is never teleported to the next level. -->
          <button id="levelNext" type="button" hidden>Start the next level</button>
        </section>

        <section id="drill" aria-live="polite" hidden>
          <!-- THE WAY BACK. The grid is the destination and the drill is entered from it, so a drill screen with no
               way back would be a one-way door. -->
          <button id="toLevel" type="button">Back to the level</button>
          <p id="prompt"></p>
          <div id="answers"></div>
          <div id="verdict" role="status"></div>
        </section>

        <section id="daily" aria-live="polite" hidden>
          <p id="dailyPrompt"></p>
          <!-- THE ROUTE, as a sequence of ARRANGEMENTS rather than calls (DESIGN.md §9.1): a waypoint is an
               arrangement the player has stood in, so two different calls that leave the same setup both satisfy it. -->
          <p id="dailyWaypoints"></p>
          <p id="dailyReadout"></p>
          <!-- HOW TO COMPOSE A TWO-GROUP STEP, and which reading is armed once one is: "Shift-click a call (⇧) to start
               a two-group step, then pick a call under another group", or "<reading> armed — …". It is not empty while
               the run is playing, because an unannounced gesture does not exist (DESIGN.md §9.2). -->
          <p id="offerPairHint"></p>
          <!-- NARROWING THE LIST. A level-1 Daily offers 277 readings over 14 subsets from the squared set and 306 over 16 from a generated start, so reaching the call a player
               has in mind used to mean scrolling a page of buttons. TWO independent narrowings, both stateful: the
               subset buttons (`aria-pressed`, press the pressed one again to show everything) and the search box,
               which matches each reading's own spelling. The count says what is left, and `0 of 306` is a real
               answer rather than an empty list with no explanation. -->
          <div id="callFilter" class="call-filter">
            <input id="callSearch" type="search" autocomplete="off" spellcheck="false" placeholder="Search calls…" aria-label="Search calls" />
            <span id="callCount" class="call-count" role="status"></span>
            <div id="callSubsets" class="call-subsets" role="group" aria-label="Filter by who dances"></div>
          </div>
          <!-- THE OFFERING LIST IS WHAT IS LEGAL NOW (DESIGN.md 9, decision 9) — not what is still solvable.
               Dead ends are the player's to discover, and the score is what makes discovering them cost. -->
          <div id="offer"></div>
          <p id="line"></p>
          <div id="dailyVerdict" role="status"></div>
          <div id="dailyResult" hidden></div>
        </section>

        <!-- THE BOARD IS A PANEL AND NOT A THIRD MODE: a mode is something a player PLAYS, and a board is a read
             (DESIGN.md §6, §11). It is loaded on demand — a board is a request, and a player who came to play
             should not pay for one they did not ask for. It says which board it is showing, because "the
             leaderboard" is three facts (§6: mode, level, period) and comparing across levels is comparing
             nothing. -->
        <section id="board" aria-live="polite" hidden>
          <p id="boardHeading"></p>
          <p id="boardStatus"></p>
          <ol id="boardList"></ol>
        </section>

        <footer id="foot">
          <!-- THE HINT ROW IS SHARED: the balance is earned on the drill line and spent on the Daily
               (DESIGN.md 10), so a player in either mode needs to see what they hold and how close the next
               one is. The progress is "silent" and the GRANT is announced once, which is the design's own
               pair of rules. -->
          <p id="balance"></p>
          <!-- WHAT IS KEPT ON THIS DEVICE. The anonymous ledger is the funnel (DESIGN.md 11: a player with a
               score to lose is a player who signs up), so the count and the best are visible before there is
               an account to claim them with — and a browser that blocks storage says so here rather than
               pretending. -->
          <p id="ledger"></p>
          <button id="hint" type="button" hidden>Hint (+1 min)</button>
          <button id="review" type="button" hidden>Show me the answer — this drill will not count</button>
          <!-- THE SKIP (DESIGN.md §15 Q5) is the mark-and-continue: the regime is an ORDER, so one puzzle a player
               cannot solve blocks every drill behind it. It earns nothing and grants no hint, and the label says so
               before the press rather than in a verdict afterwards. -->
          <button id="skip" type="button" hidden>Skip this drill — no score, no hint</button>
          <button id="undo" type="button" hidden>Undo</button>
          <button id="redo" type="button" hidden>Redo</button>
          <button id="giveUp" type="button" hidden>Give up</button>
          <!-- THE REPLAY LIST: the calls a solved line was made of, as text. It is READ BACK, not played from here —
               the owner's call ("the list of calls and the 'your line' button are actually enough"), which is what
               took the play/pause and the scrub out. The two buttons after it choose WHICH line, once one exists. -->
          <div id="replayBox" hidden>
            <p id="replayHeading"></p>
            <ol id="replayCalls"></ol>
          </div>
          <button id="replayMine" type="button" hidden>Play</button>
          <button id="replayShortest" type="button" hidden>The shortest line</button>
          <button id="view" type="button">Switch to 2D</button>
          <!-- THE PRACTICE OFFER (DESIGN.md §15 Q20) is HIDDEN until the server refuses a drill: the fixture's order
               is not the season's, so it is offered by name rather than substituted quietly, and the label says what
               taking it means. -->
          <button id="practice" type="button" hidden>Practice offline — this one will not count</button>
          <button id="boardToggle" type="button">Show the board</button>
          <!-- THE ONE CONTROL THAT DELETES SOMETHING (DESIGN.md §15 Q18). It is a FOOTER control rather than a
               browser dialog because the armed state is a rule the shell owns — two presses, with the second one
               saying what will go — where a native `confirm()` is an API no probe can see. The ledger's own line
               ("Saved on this device: nothing yet") is what reports the result.
               IT DELETES THE DEVICE'S RECORD AND NOTHING ELSE, and with a server configured that is all it ever could:
               the drills and the Daily are generated and published there from one shared schedule, so every player is
               served the same ones — which is what makes a score comparable — while a player's row holds only their
               own progress. `startOver` in `main.ts` says exactly that in the panel after the clear. -->
          <button id="startOver" type="button">Start over on this device</button>
          <!-- AUTO-PROGRESS (owner's request): a TOGGLE, because it changes what happens after the NEXT correct guess
               rather than doing anything on the press. Its state is on the button — `aria-pressed` plus the label — and
               the rule it drives is `autoProgress` in `main.ts`: once a solved drill's landing has been held, the
               press that would have been the player's is made for them. Hidden outside the Drill's question view. -->
          <button id="autoProgress" type="button" aria-pressed="false" hidden>Auto-progress: off</button>
          <button id="next" type="button" hidden>Next drill</button>
        </footer>
      </main>

      <div id="loading">Loading the corpus…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
