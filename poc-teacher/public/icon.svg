<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="104" fill="#0b7a43"/>
  <!-- Four corners of the square set (4 couples) -->
  <g fill="#ffffff">
    <circle cx="256" cy="96"  r="30"/>
    <circle cx="256" cy="416" r="30"/>
    <circle cx="96"  cy="256" r="30"/>
    <circle cx="416" cy="256" r="30"/>
