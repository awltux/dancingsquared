<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dancing Squared — 3D Square Dance PoC</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="loadingOverlay" class="loading-overlay">
      <div class="loading-card">
        <div class="loading-title">Dancing Squared</div>
        <div class="loading-bar"><div id="loadingFill" class="loading-fill"></div></div>
        <div id="loadingLabel" class="loading-label">Loading&hellip;</div>
      </div>
    </div>
    <div id="app">
      <canvas id="stage"></canvas>
      <div id="hud">
        <h1>Dancing Squared <span>PoC</span></h1>
        <div class="row">
          <label>Mode</label>
          <select id="modeSelect">
            <option value="browse">Browse calls</option>
            <option value="sequence">Sequencer</option>
            <option value="editor">Call editor</option>
            <option value="fsm">FSM view</option>
          </select>
        </div>
        <div id="browseControls">
        <div class="row">
          <label>Level</label>
          <select id="levelSelect"></select>
        </div>
        <div class="row">
          <label>Call</label>
          <select id="callSelect"></select>
          <label>Setup</label>
          <select id="tamSelect"></select>
        </div>
        <div class="row">
          <label>End</label>
          <span id="browseEndFormation" class="part"></span>
        </div>
        <div class="row" id="browseLabelRow" hidden>
          <label>Label</label>
          <input id="browseFormationName" class="wide" type="text" placeholder="name this formation — e.g. &quot;Left-Hand Waves, offset&quot;" />
          <button id="browseCreateFormation" title="Store the end board's geometry under this name, tagged user-defined, and register it with the formation library so boards like it are recognised from now on">Create</button>
        </div>
        <div id="browseUserFormations" class="small"></div>
        <div class="row">
          <button id="play" title="Play / resume">▶ Play</button>
          <button id="pause" title="Pause (hold current frame)">⏸ Pause</button>
          <button id="stepBack" title="Step backward 1/4 beat">⏪</button>
          <button id="stepFwd" title="Step forward 1/4 beat">⏩</button>
          <label>Speed</label>
          <select id="speed">
            <option value="0.5">Half</option>
            <option value="1" selected>1×</option>
            <option value="2">2×</option>
            <option value="4">4×</option>
          </select>
          <span id="partLabel" class="part"></span>
        </div>
        <div class="row">
          <label title="Where the dancers are in the call. Drag to move them along the call by hand — playback pauses while you drag.">Position</label>
          <input id="scrub" type="range" min="0" max="1" step="0.25" value="0" title="Drag to move the dancers along the call. Playback pauses while you drag, so this is how to place them by hand." />
          <input id="beatInput" type="number" min="0" step="0.25" value="0" class="small" title="Type a beat to place the dancers exactly there (0 = the first beat of the call)" />
          <span id="beatReadout" class="part"></span>
        </div>
        <div class="row">
          <label><input id="mirror" type="checkbox" checked /> Full square (mirror)</label>
        </div>
        <div id="browseUses" class="small"></div>
        <div id="legend"></div>
        </div>
        <div id="seqPanel" hidden>
          <div class="row">
            <label>Margin</label>
            <input id="seqMargin" type="number" min="0" max="6" step="0.5" value="4" class="small" title="Extra matching tolerance for viable next calls" />
          </div>
          <div class="row">
            <label>Level</label>
            <select id="seqLevel"></select>
            <select id="seqCallSelect" class="wide"></select>
          </div>
          <div class="row">
            <label>Formation</label>
            <select id="seqFormation" class="wide"></select>
            <button id="seqSetFormation" title="Jump the board to the chosen formation">Set</button>
            <label title="Rotate the displayed board (degrees)">Rot</label>
            <input id="seqBoardRot" type="number" step="15" value="0" class="small" style="width:52px" title="Rotate the displayed board by degrees (e.g. 45)" />
            <label title="Dancer rendering">View</label>
            <select id="seqView2d" title="3D avatars or 2D markers">
              <option value="3d">3D</option>
              <option value="2d">2D</option>
            </select>
          </div>
          <div class="row">
            <button id="seqApply">Apply</button>
            <button id="seqUndo">Undo</button>
            <button id="seqReset">Reset</button>
          </div>
          <div class="row">
            <button id="seqGetout">Getout</button>
            <button id="seqMatrixGetout" title="Rigid self-inverse single-call getout via the matrix fast-path (O(1), exact)">Matrix getout</button>
            <button id="seqApplyGetout">Apply getout</button>
            <button id="seqGetin" title="Search from home into the current formation (getin)">Getin</button>
            <button id="seqFixIt">Fix it</button>
            <button id="seqCopyPos" title="Copy all dancers' positions to the clipboard (for debug reports)">Copy positions</button>
            <span id="seqStatus" class="part"></span>
          </div>
          <div id="seqMatrixInfo" class="small"></div>
          <div class="row">
            <button id="seqPlay">▶ Play</button>
            <label>Beat</label>
            <input id="seqBeatInput" type="number" min="0" step="0.1" value="0" class="small" title="Jump the playback to a specific beat" />
            <span id="seqBeat" class="part"></span>
          </div>
          <div class="row">
            <input id="seqScrub" type="range" min="0" max="100" step="0.1" value="100" style="flex:1" />
          </div>
          <div id="seqSequence" class="small"></div>
          <div id="seqFasr" class="small"></div>
          <div id="seqSubsetInfo" class="small"></div>
          <div id="seqFixList" class="small"></div>
          <div class="row">
            <input id="seqModuleName" class="wide" placeholder="Module name (fix/getout)" />
            <button id="seqSaveModule">Save module</button>
          </div>
          <div id="seqModules" class="small"></div>
          <div class="row">
            <label title="All8 call-format text: 2+5 abbreviations, optional [FASR] setup, call sharing by indentation">All8</label>
            <button id="seqAll8Import" title="Parse the text below as All8 figures and load the first one as a sequence">Import</button>
            <button id="seqAll8Export" title="Render the current sequence as All8 call-format text">Export</button>
            <span id="seqAll8Info" class="part"></span>
          </div>
          <div class="row">
            <textarea id="seqAll8Text" class="wide" rows="3"
              placeholder="Paste All8 figures, e.g.  H-SqTh4 --DoSaD --SwThr B-RunR --Cpl.C --ChDTL --PsOcn --A8Cir --Sw&Pr"></textarea>
          </div>
        </div>
        <div id="editorPanel" hidden>
          <div class="row">
            <label>Mode</label>
            <select id="edMode">
              <option value="instance">Edit instance</option>
              <option value="fix">Fix closure</option>
              <option value="create">Create position</option>
            </select>
          </div>
          <div class="row">
            <label>Find</label>
            <input
              id="edCallFilter"
              class="wide"
              type="text"
              placeholder="filter calls: level, title or setup — e.g. &quot;circle&quot;, &quot;ms wave&quot;, &quot;static square&quot;"
              title="Narrows EVERY call list in this panel (edit, post and pre). Terms are ANDed and matched as substrings against the level, the title, the file and the setup's `from` label, so &quot;ms circle&quot; and &quot;static square&quot; both work. The call you currently have selected is always kept at the top of its list, so narrowing the list cannot silently change what you are editing. Escape clears it."
            />
            <span id="edCallFound" class="part"></span>
          </div>
          <div class="row">
            <label>Edit call</label>
            <select id="edCall" class="wide"></select>
            <label>Setup</label>
            <select id="edSetup"></select>
          </div>
          <div id="edInstancePanel">
            <div class="row">
              <button id="edInstReset" title="Throw away the edits made in this tab and reload the instance. An edit already applied to the live catalogue is part of what is reloaded.">Reset</button>
              <button id="edClone" title="Start a NEW setup from this instance instead of replacing it: edits are then saved and applied as an addition. Picking a Start setup re-bases the clone onto that formation.">Clone</button>
              <button id="edInstExport" title="Export the edited instance as taminations &lt;tam&gt; XML">Export &lt;tam&gt;</button>
              <span id="edInstInfo" class="part"></span>
            </div>
            <div class="row">
              <label>Start setup</label>
              <select id="edStartFormation" class="wide" title="Re-base the clone's START formation onto a named 8-dancer formation, keeping every move. The track will not end where the call ends - that is what Connect is for."></select>
              <button id="edConnect" title="Re-aim the FIRST move of every dancer so it connects the new start to the old track. The end formation comes back exactly; no other move changes.">Connect</button>
            </div>
            <div class="small" id="edCloneInfo"></div>
            <div class="small">
              <b>Formation</b> — the start pose of every dancer, and the pose each arrives at. The
              <i>gender</i> column is the ARRANGEMENT (which spots hold a boy and which a girl); <i>couple</i>
              is a read of the start formation, not a field of the format, so it follows the positions.
            </div>
            <div id="edFormation"></div>
            <div class="row">
              <label title="Where the dancers are in the call. The animation is OFF while editing an instance: DRAG THIS to move them by hand along the call.">Position</label>
              <input id="edScrub" type="range" min="0" max="1" step="0.25" value="0" title="Drag to move the dancers along the call by hand. The animation is off here, so this is the only thing that moves them." />
              <span id="edBeatReadout" class="part"></span>
            </div>
            <div class="row">
              <label>Moves of</label>
              <select id="edMoveDancer"></select>
              <button id="edMoveAll" title="Select every dancer (or only the one shown). Most calls give each dancer the same movement rotated into its own position, so a move change usually belongs on all of them at once.">all</button>
              <button id="edMoveAdd" title="Append a one-beat pause to this dancer">+ Move</button>
              <button id="edMoveDel" title="Delete the current move">− Move</button>
              <span id="edMoveInfo" class="part"></span>
            </div>
            <div id="edMoveStrip" class="ed-moves"></div>
          </div>
          <div class="row" id="edPostRow">
            <label>Post call</label>
            <select id="edPostCall" class="wide"></select>
            <label>Post setup</label>
            <select id="edPostSetup"></select>
          </div>
          <div id="edFixPanel">
            <div class="row">
              <button id="edShowEnd" title="Show the edit call setup's end position">Show end</button>
              <button id="edShowTarget" title="Show the post call's start position (the target)">Show target</button>
              <button id="edFix" title="Retarget the final move so the selected setup ends at the post-call start (beats unchanged)">Fix closure</button>
              <span id="edFixInfo" class="part"></span>
            </div>
          </div>
          <div id="edCreatePanel" hidden>
            <div class="row">
              <label>Pre call</label>
              <select id="edPreCall" class="wide"></select>
              <label>Pre setup</label>
              <select id="edPreSetup"></select>
              <button id="edShowStart" title="Show the pre call's end position (the new start)">Show start</button>
            </div>
            <div class="row">
              <label>Name</label>
              <input id="edName" class="wide" placeholder="New position name" />
              <label>Pad beats</label>
              <input id="edPadBeats" type="number" min="0" max="8" step="0.5" value="2" class="small" />
              <button id="edCreate" title="Synthesize a new position from pre-end to post-start through the selected setup">Create</button>
            </div>
          </div>
          <div class="row">
            <button id="edSave">Save</button>
            <button id="edExport">Export &lt;tam&gt; XML</button>
            <span id="edStatus" class="part"></span>
          </div>
          <div id="edSaved" class="small"></div>
          <textarea id="edXml" class="small" rows="6" readonly placeholder="Exported <tam> XML appears here."></textarea>
          <div class="row">
            <label>Facing</label>
            <select id="facing" title="How the previewed dancers orient: the authored rotation Bézier, or always along the travel direction.">
              <option value="rotation" selected>Rotation Bézier (data)</option>
              <option value="travel">Along travel</option>
            </select>
          </div>
        </div>
      </div>
    </div>
    <div id="fsmPanel" hidden>
      <div class="fsm-toolbar"><span id="fsmTitle" class="part"></span></div>
      <iframe id="fsmFrame" title="FSM visual"></iframe>
    </div>
    <footer id="buildFooter" class="build-footer"></footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
